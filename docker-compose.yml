services:

  # ── Banco de dados PostgreSQL ───────────────────────────────────────────────
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB:       lealcert
      POSTGRES_USER:     ${DB_USER:-lealcert}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
  # ── API (Express + Drizzle) ─────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    environment:
      DATABASE_URL:   postgresql://${DB_USER:-lealcert}:${DB_PASSWORD}@db:5432/lealcert
      SESSION_SECRET: ${SESSION_SECRET}
      PORT:           8080
      NODE_ENV:       production
      SMTP_HOST:      ${SMTP_HOST:-}
      SMTP_PORT:      ${SMTP_PORT:-587}
      SMTP_USER:      ${SMTP_USER:-}
      SMTP_PASS:      ${SMTP_PASS:-}
      SMTP_FROM:      ${SMTP_FROM:-}
    depends_on:
      - db
    volumes:
      - uploads:/app/uploads
    expose:
      - "8080"

  # ── Frontend (Nginx + React build) ─────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  postgres_data:
  uploads:
