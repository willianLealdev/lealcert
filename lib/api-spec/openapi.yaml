components:
  schemas:
    OrderEvent:
      type: object
      required: [id, orderId, type, message, createdAt]
      properties:
        id:
          type: integer
        orderId:
          type: integer
        type:
          type: string
        message:
          type: string
        meta:
          type: object
          nullable: true
        createdAt:
          type: string
          format: date-time

    CertificateRenewal:
      type: object
      required: [id, orderId, customerName, customerCpfCnpj, certificateName, validityMonths, emittedAt, expiresAt]
      properties:
        id:
          type: integer
        orderId:
          type: integer
        customerName:
          type: string
        customerCpfCnpj:
          type: string
        customerEmail:
          type: string
          nullable: true
        certificateName:
          type: string
        garPedido:
          type: string
          nullable: true
        garProtocolo:
          type: string
          nullable: true
        validityMonths:
          type: integer
        emittedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        alertSent30d:
          type: boolean
        alertSent7d:
          type: boolean
        alertSent1d:
          type: boolean
        createdAt:
          type: string
          format: date-time

    CheckAlertsResult:
      type: object
      required: [ok, processed, sent]
      properties:
        ok:
          type: boolean
        processed:
          type: integer
        sent:
          type: integer
        results:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              customer: { type: string }
              daysLeft: { type: integer }
              sent: { type: boolean }

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    RegisterInput:
      type: object
      required: [name, email, cpfCnpj, password, userType]
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        cpfCnpj:
          type: string
        password:
          type: string
          minLength: 6
        phone:
          type: string
        userType:
          type: string
          enum: [contador, cliente]

    VerifyEmailInput:
      type: object
      required: [email, code]
      properties:
        email:
          type: string
        code:
          type: string

    ResendVerificationInput:
      type: object
      required: [email]
      properties:
        email:
          type: string

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    LoginInput:
      type: object
      required: [cpfCnpj, password]
      properties:
        cpfCnpj:
          type: string
        password:
          type: string

    AuthUser:
      type: object
      required: [id, name, email, cpfCnpj, role]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        cpfCnpj:
          type: string
        role:
          type: string
          enum: [admin, contador]
        userType:
          type: string
          enum: [contador, cliente]
        mustChangePassword:
          type: boolean
        phone:
          type: ["string", "null"]
        createdAt:
          type: string

    ForgotPasswordInput:
      type: object
      required: [cpfCnpj]
      properties:
        cpfCnpj:
          type: string

    ChangePasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 6

    ProfileUpdate:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        currentPassword:
          type: string
        newPassword:
          type: string

    User:
      type: object
      required: [id, name, cpfCnpj, role, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: ["string", "null"]
        cpfCnpj:
          type: string
        role:
          type: string
          enum: [admin, contador]
        phone:
          type: ["string", "null"]
        isActive:
          type: boolean
        createdAt:
          type: string

    UserInput:
      type: object
      required: [name, cpfCnpj, password, role]
      properties:
        name:
          type: string
        email:
          type: string
        cpfCnpj:
          type: string
        password:
          type: string
        role:
          type: string
          enum: [admin, contador]
        phone:
          type: string

    UserUpdate:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        role:
          type: string
          enum: [admin, contador]
        isActive:
          type: boolean
        password:
          type: string

    Certificate:
      type: object
      required: [id, name, price, active, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        price:
          type: number
        priceContador:
          type: ["number", "null"]
        active:
          type: boolean
        garHashProduto:
          type: ["string", "null"]
        safewebIdProduto:
          type: ["string", "null"]
        createdAt:
          type: string

    CertificateInput:
      type: object
      required: [name, price]
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: number
        priceContador:
          type: number
        active:
          type: boolean
        garHashProduto:
          type: string
        safewebIdProduto:
          type: string

    CertificateUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: number
        priceContador:
          type: number
        active:
          type: boolean
        garHashProduto:
          type: string
        safewebIdProduto:
          type: string

    Order:
      type: object
      required: [id, orderNumber, userId, certificateId, status, total, customerName, customerCpfCnpj, createdAt]
      properties:
        id:
          type: integer
        orderNumber:
          type: string
