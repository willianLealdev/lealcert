      required: [id, orderId, type, message, createdAt]
      properties:
        id:
          type: integer
        orderId:
          type: integer
        type:
          type: string
        message:
          type: string
        meta:
          type: object
          nullable: true
        createdAt:
          type: string
          format: date-time

    CertificateRenewal:
      type: object
