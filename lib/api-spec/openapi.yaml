openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: LealCert - Sistema de Venda de Certificados Digitais
servers:
  - url: /api
    description: Base API path
tags:
  - name: coupons
    description: Discount coupons
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: users
    description: User management
  - name: certificates
    description: Certificate models
  - name: orders
    description: Orders
  - name: slots
    description: Scheduling slots
  - name: meetings
    description: Video meetings for administrators and sellers
  - name: support
    description: Support tickets
  - name: settings
    description: App settings
  - name: dashboard
    description: Dashboard stats
  - name: marketing
    description: Email marketing
  - name: openai
    description: OpenAI AI chat operations
  - name: gestaoar
    description: Gestão AR integration — produtos, vendas, protocolo e agenda
  - name: nfse
    description: NFS-e (Nota Fiscal de Serviço Eletrônica) — BrasilNFe integration

paths:
  /coupons:
    get:
      operationId: listCoupons
      tags: [coupons]
      summary: List all coupons (admin)
      responses:
        "200":
          description: List of coupons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Coupon"
    post:
      operationId: createCoupon
      tags: [coupons]
      summary: Create a new coupon (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CouponInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Coupon"

  /coupons/validate:
    post:
      operationId: validateCoupon
      tags: [coupons]
      summary: Validate a coupon code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CouponValidateInput"
      responses:
        "200":
          description: Valid coupon
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Coupon"
        "404":
          description: Invalid or inactive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: Expired or exhausted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not allowed for this user role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /coupons/{id}:
    patch:
      operationId: updateCoupon
      tags: [coupons]
      summary: Update a coupon (admin)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CouponInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Coupon"
    delete:
      operationId: deleteCoupon
      tags: [coupons]
      summary: Delete a coupon (admin)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /openai/chat/session:
    post:
      operationId: createChatSession
      tags: [openai]
      summary: Create a new chat session (returns session id)
      responses:
        "201":
          description: Created session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversation"

  /openai/chat:
    post:
      operationId: sendChatMessage
      tags: [openai]
      summary: Send message to the AI sales chat (SSE stream)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageInput"
      responses:
        "200":
          description: SSE stream of assistant text chunks
          content:
            text/event-stream: {}

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/validate-crc:
    get:
      operationId: validateCrc
      tags: [auth]
      summary: Validate a CRC number against the CFC API
      parameters:
        - in: query
          name: crc
          required: true
          schema:
            type: string
          description: CRC number (e.g. SP100000O)
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrcValidationResult"
        "400":
          description: Invalid CRC format
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/lookup-cnpj:
    get:
      operationId: lookupCnpj
      tags: [auth]
      summary: Lookup company data by CNPJ via BrasilAPI
      parameters:
        - in: query
          name: cnpj
          required: true
          schema:
            type: string
          description: CNPJ (14 digits)
      responses:
        "200":
          description: Company data or not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CnpjLookupResult"
        "400":
          description: Invalid CNPJ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Account created, verification email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: CPF/CNPJ or email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/verify-email:
    post:
      operationId: verifyEmail
      tags: [auth]
      summary: Verify email with code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailInput"
      responses:
        "200":
          description: Email verified, user logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: Invalid or expired code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/resend-verification:
    post:
      operationId: resendVerification
      tags: [auth]
      summary: Resend verification code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendVerificationInput"
      responses:
        "200":
          description: Code resent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with CPF/CNPJ and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Request password reset (sends temporary password via email)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordInput"
      responses:
        "200":
          description: Temporary password sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change password (required after temp password login)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid current password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/profile:
    patch:
      operationId: updateProfile
      tags: [auth]
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users (admin only)
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a new user (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete user (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /certificates:
    get:
      operationId: listCertificates
      tags: [certificates]
      summary: List certificate models
      parameters:
        - name: activeOnly
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Certificate models
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Certificate"
    post:
      operationId: createCertificate
      tags: [certificates]
      summary: Create certificate model (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CertificateInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Certificate"

  /certificates/batch-delete:
    post:
      operationId: batchDeleteCertificates
      tags: [certificates]
      summary: Delete certificates by IDs, skipping those with paid orders (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items:
                    type: integer
      responses:
        "200":
          description: Deletion result
          content:
            application/json:
              schema:
                type: object
                required: [deleted, skipped]
                properties:
                  deleted:
                    type: integer
                  skipped:
                    type: integer
                  skippedIds:
                    type: array
                    items:
                      type: integer

  /certificates/batch-toggle:
    post:
      operationId: batchToggleCertificates
      tags: [certificates]
      summary: Activate or deactivate all certificates matching product + issuanceType (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchToggleCertificatesInput"
      responses:
        "200":
          description: Number of updated certificates
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  updated:
                    type: integer

  /certificates/import-safeweb:
    post:
      operationId: importSafewebCertificates
      tags: [certificates]
      summary: Import certificate models from Safeweb API (admin only)
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                type: object
                required: [imported, skipped, total]
                properties:
                  imported:
                    type: integer
                  skipped:
                    type: integer
                  total:
                    type: integer

  /certificates/import-gar:
    post:
      operationId: importGarCertificates
      tags: [certificates]
      summary: Import certificate models from Gestão AR API (admin only)
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                type: object
                required: [imported, updated, skipped, total]
                properties:
                  imported:
                    type: integer
                  updated:
                    type: integer
                  skipped:
                    type: integer
                  total:
                    type: integer

  /certificates/{id}:
    patch:
      operationId: updateCertificate
      tags: [certificates]
      summary: Update certificate model (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CertificateUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Certificate"
    delete:
      operationId: deleteCertificate
      tags: [certificates]
      summary: Delete certificate model (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List orders (admin sees all, contador sees own)
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Orders list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create a new order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /operators:
    get:
      operationId: listOperators
      tags: [operators]
      summary: List operators belonging to the authenticated accountant
      responses:
        "200":
          description: Operators
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Operator"
    post:
      operationId: createOperator
      tags: [operators]
      summary: Create an operator and email temporary credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorInput"
      responses:
        "201":
          description: Operator created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operator"

  /operators/{id}:
    patch:
      operationId: updateOperator
      tags: [operators]
      summary: Block or unblock an operator
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorUpdate"
      responses:
        "200":
          description: Operator updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operator"
    delete:
      operationId: deleteOperator
      tags: [operators]
      summary: Delete an operator owned by the authenticated accountant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Operator deleted

  /operators/{id}/reset-password:
    post:
      operationId: resetOperatorPassword
      tags: [operators]
      summary: Send a new temporary password to an operator
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Temporary password sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /cnpj-lookup:
    get:
      operationId: cnpjLookup
      tags: [orders]
      summary: Consulta dados de CNPJ via Receita Federal (BrasilAPI)
      parameters:
        - name: cnpj
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Dados do CNPJ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CnpjLookupResult"

  /orders/consulta-previa:
    post:
      operationId: consultaPrevia
      tags: [orders]
      summary: Valida CPF/CNPJ e verifica PSBio antes de criar pedido
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsultaPreviaInput"
      responses:
        "200":
          description: Resultado da consulta prévia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsultaPreviaResult"

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get order details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateOrder
      tags: [orders]
      summary: Update order status (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderUpdate"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/{id}/payment:
    post:
      operationId: createPayment
      tags: [orders]
      summary: Create MercadoPago payment preference for order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInput"
      responses:
        "200":
          description: Payment preference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentPreference"

  /orders/{id}/sync-payment:
    post:
      operationId: syncPaymentOrder
      tags: [orders]
      summary: Manually check MP payment status and mark order as paid if approved
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                  status:
                    type: string
                  error:
                    type: string

  /orders/{id}/safeweb-config:
    get:
      operationId: getSafewebConfig
      tags: [orders]
      summary: Retorna configuração de agenda do local Safeweb (dias/horários de atendimento)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: idLocal
          in: query
          required: true
          schema:
            type: integer
          description: ID do local de atendimento
      responses:
        "200":
          description: Configuração do local
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafewebConfigResult"

  /orders/{id}/safeweb-locais:
    get:
      operationId: getSafewebLocais
      tags: [orders]
      summary: Lista locais de atendimento Safeweb (por CNPJ AR)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Locais de atendimento
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafewebLocaisResult"

  /orders/{id}/safeweb-slots:
    get:
      operationId: getSafewebSlots
      tags: [orders]
      summary: Lista horários disponíveis na Safeweb para agendamento
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: idLocal
          in: query
          required: true
          schema:
            type: integer
          description: ID do local de atendimento
        - name: date
          in: query
          required: false
          schema:
            type: string
          description: "Data no formato YYYY-MM-DD (padrão: hoje)"
      responses:
        "200":
          description: Horários disponíveis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafewebSlotsResult"

  /orders/{id}/safeweb-agendar:
    post:
      operationId: agendarSafewebOrder
      tags: [orders]
      summary: Agenda atendimento via Safeweb para o pedido
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SafewebAgendarInput"
      responses:
        "200":
          description: Agendamento realizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafewebAgendarResult"

  /orders/{id}/safeweb-cancelar:
    post:
      operationId: cancelarSafewebOrder
      tags: [orders]
      summary: Cancela a solicitação Safeweb (somente admin, status aguardando_validacao)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SafewebCancelarInput"
      responses:
        "200":
          description: Solicitação cancelada
          content:
            application/json:
              schema:
