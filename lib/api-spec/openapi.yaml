openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: LealCert - Sistema de Venda de Certificados Digitais
servers:
  - url: /api
    description: Base API path
tags:
  - name: coupons
    description: Discount coupons
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: users
    description: User management
  - name: certificates
    description: Certificate models
  - name: orders
    description: Orders
  - name: slots
    description: Scheduling slots
  - name: support
    description: Support tickets
  - name: settings
    description: App settings
  - name: dashboard
    description: Dashboard stats
  - name: marketing
    description: Email marketing
  - name: openai
    description: OpenAI AI chat operations
  - name: gestaoar
    description: Gestão AR integration — produtos, vendas, protocolo e agenda

paths:
  /coupons:
    get:
      operationId: listCoupons
      tags: [coupons]
      summary: List all coupons (admin)
      responses:
        "200":
          description: List of coupons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Coupon"
    post:
      operationId: createCoupon
      tags: [coupons]
      summary: Create a new coupon (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CouponInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Coupon"

  /coupons/validate:
    post:
      operationId: validateCoupon
      tags: [coupons]
      summary: Validate a coupon code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CouponValidateInput"
      responses:
        "200":
          description: Valid coupon
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Coupon"
        "404":
          description: Invalid or inactive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: Expired or exhausted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not allowed for this user role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /coupons/{id}:
    patch:
      operationId: updateCoupon
      tags: [coupons]
      summary: Update a coupon (admin)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CouponInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Coupon"
    delete:
      operationId: deleteCoupon
      tags: [coupons]
      summary: Delete a coupon (admin)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /openai/chat/session:
    post:
      operationId: createChatSession
      tags: [openai]
      summary: Create a new chat session (returns session id)
      responses:
        "201":
          description: Created session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversation"

  /openai/chat:
    post:
      operationId: sendChatMessage
      tags: [openai]
      summary: Send message to the AI sales chat (SSE stream)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageInput"
      responses:
        "200":
          description: SSE stream of assistant text chunks
          content:
            text/event-stream: {}

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Account created, verification email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: CPF/CNPJ or email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/verify-email:
    post:
      operationId: verifyEmail
      tags: [auth]
      summary: Verify email with code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailInput"
      responses:
        "200":
          description: Email verified, user logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: Invalid or expired code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/resend-verification:
    post:
      operationId: resendVerification
      tags: [auth]
      summary: Resend verification code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendVerificationInput"
      responses:
        "200":
          description: Code resent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with CPF/CNPJ and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Request password reset (sends temporary password via email)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordInput"
      responses:
        "200":
          description: Temporary password sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change password (required after temp password login)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid current password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/profile:
    patch:
      operationId: updateProfile
      tags: [auth]
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users (admin only)
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a new user (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete user (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /certificates:
    get:
      operationId: listCertificates
      tags: [certificates]
      summary: List certificate models
      parameters:
        - name: activeOnly
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Certificate models
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Certificate"
    post:
      operationId: createCertificate
      tags: [certificates]
      summary: Create certificate model (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CertificateInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Certificate"

  /certificates/{id}:
    patch:
      operationId: updateCertificate
      tags: [certificates]
      summary: Update certificate model (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CertificateUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Certificate"
    delete:
      operationId: deleteCertificate
      tags: [certificates]
      summary: Delete certificate model (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List orders (admin sees all, contador sees own)
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Orders list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create a new order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /cnpj-lookup:
    get:
      operationId: cnpjLookup
      tags: [orders]
      summary: Consulta dados de CNPJ via Receita Federal (BrasilAPI)
      parameters:
        - name: cnpj
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Dados do CNPJ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CnpjLookupResult"

  /orders/consulta-previa:
    post:
      operationId: consultaPrevia
      tags: [orders]
      summary: Valida CPF/CNPJ e verifica PSBio antes de criar pedido
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsultaPreviaInput"
      responses:
        "200":
          description: Resultado da consulta prévia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsultaPreviaResult"

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get order details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateOrder
      tags: [orders]
      summary: Update order status (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderUpdate"
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"

  /orders/{id}/payment:
    post:
      operationId: createPayment
      tags: [orders]
      summary: Create MercadoPago payment preference for order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Payment preference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentPreference"

  /orders/{id}/sync-provider:
    post:
      operationId: syncProviderOrder
      tags: [orders]
      summary: Sync order status from active provider (Safeweb or Gestão AR)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncProviderResult"

  /slots:
    get:
      operationId: listSlots
      tags: [slots]
      summary: List available scheduling slots
      parameters:
        - name: date
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Available slots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Slot"
    post:
      operationId: createSlot
      tags: [slots]
      summary: Create scheduling slot (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SlotInput"
      responses:
        "201":
          description: Created slot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Slot"

  /slots/generate:
    post:
      operationId: generateSlots
      tags: [slots]
      summary: Generate slots from schedule config (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateSlotsInput"
      responses:
        "200":
          description: Generation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateSlotsResult"

  /slots/{id}:
    delete:
      operationId: deleteSlot
      tags: [slots]
      summary: Delete scheduling slot (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /support:
    get:
      operationId: listTickets
      tags: [support]
      summary: List support tickets
      responses:
        "200":
          description: Tickets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ticket"
    post:
      operationId: createTicket
      tags: [support]
      summary: Create a support ticket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketInput"
      responses:
        "201":
          description: Created ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"

  /support/{id}:
    get:
      operationId: getTicket
      tags: [support]
      summary: Get ticket with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Ticket detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketDetail"

  /support/{id}/messages:
    post:
      operationId: replyTicket
      tags: [support]
      summary: Reply to a ticket
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /support/{id}/close:
    patch:
      operationId: closeTicket
      tags: [support]
      summary: Close a ticket
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Closed ticket
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"

  /gestaoar/produtos:
    get:
      operationId: getGarProdutos
      tags: [gestaoar]
      summary: Tabela de preços real da Gestão AR
      parameters:
        - { name: documento, in: query, schema: { type: string } }
        - { name: tipoProduto, in: query, schema: { type: integer } }
        - { name: tipoEmissao, in: query, schema: { type: integer } }
        - { name: validade, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Tabela de preços
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GarTabelaPrecos"

  /gestaoar/tipos-emissao:
    get:
      operationId: getGarTiposEmissao
      tags: [gestaoar]
      summary: Tipos de emissão disponíveis na Gestão AR
      parameters:
        - { name: documento, in: query, schema: { type: string } }
      responses:
        "200":
          description: Tipos de emissão
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GarTipoEmissao"

  /gestaoar/tipos-produto:
    get:
      operationId: getGarTiposProduto
      tags: [gestaoar]
      summary: Tipos de produto disponíveis na Gestão AR
      parameters:
        - { name: documento, in: query, schema: { type: string } }
      responses:
        "200":
          description: Tipos de produto
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GarTipoProduto"

  /gestaoar/validades:
    get:
      operationId: getGarValidades
      tags: [gestaoar]
      summary: Validades disponíveis na Gestão AR
      parameters:
        - { name: tipo, in: query, schema: { type: integer } }
        - { name: tipoEmissao, in: query, schema: { type: integer } }
      responses:
        "200":
          description: Validades
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GarValidade"

  /gestaoar/familias:
    get:
      operationId: getGarFamilias
      tags: [gestaoar]
      summary: Famílias de produtos da Gestão AR
      responses:
        "200":
          description: Famílias
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    Id: { type: integer }
                    Nome: { type: string }

  /gestaoar/formas-pagamento:
    get:
      operationId: getGarFormasPagamento
      tags: [gestaoar]
      summary: Formas de pagamento da Gestão AR
      responses:
        "200":
          description: Formas de pagamento
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GarFormaPagamento"

  /gestaoar/psbio:
    post:
      operationId: checkGarPsBio
      tags: [gestaoar]
      summary: Verifica biometria coletada (PSBio) para um CPF
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GarPsBioInput"
      responses:
        "200":
          description: Resultado PSBio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GarPsBioResult"

  /gestaoar/ufs:
    get:
      operationId: getGarUFs
      tags: [gestaoar]
      summary: UFs com locais de atendimento na Gestão AR
      responses:
        "200":
          description: UFs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GarUF"

  /gestaoar/municipios:
    get:
      operationId: getGarMunicipios
      tags: [gestaoar]
      summary: Municípios com locais de atendimento
      parameters:
        - { name: uf, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Municípios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GarMunicipio"

  /gestaoar/locais:
    get:
      operationId: getGarLocais
      tags: [gestaoar]
      summary: Locais de agendamento da Gestão AR
      parameters:
        - { name: uf, in: query, schema: { type: string } }
        - { name: municipio, in: query, schema: { type: string } }
      responses:
        "200":
          description: Locais de agendamento
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GarLocalAgendamento"

  /gestaoar/locais/{hashLocal}/slots:
    get:
      operationId: getGarSlotsLocal
      tags: [gestaoar]
      summary: Slots de atendimento de um local
      parameters:
        - { name: hashLocal, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Slots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GarSlotAtendimento"

