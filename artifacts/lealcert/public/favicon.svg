<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fundo azul escuro arredondado -->
  <rect width="256" height="256" rx="52" fill="#0f172a"/>

  <!-- Partículas digitais (canto superior esquerdo) -->
  <rect x="34" y="78" width="14" height="14" rx="3" fill="#2563eb" opacity="0.9"/>
  <rect x="52" y="68" width="11" height="11" rx="2.5" fill="#2563eb" opacity="0.7"/>
  <rect x="34" y="96" width="11" height="11" rx="2.5" fill="#2563eb" opacity="0.7"/>
  <rect x="49" y="88" width="9" height="9" rx="2" fill="#2563eb" opacity="0.5"/>
  <rect x="62" y="82" width="7" height="7" rx="1.5" fill="#2563eb" opacity="0.4"/>
  <rect x="40" y="111" width="8" height="8" rx="2" fill="#2563eb" opacity="0.4"/>
  <rect x="53" y="103" width="6" height="6" rx="1.5" fill="#2563eb" opacity="0.3"/>

  <!-- Escudo ouro (parte superior / traseira) -->
