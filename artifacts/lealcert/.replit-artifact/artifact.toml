kind = "web"
previewPath = "/"
title = "LealCert"
version = "1.0.0"
id = "artifacts/lealcert"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18614

[services.development]
run = "pnpm --filter @workspace/lealcert run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lealcert", "run", "build" ]
publicDir = "artifacts/lealcert/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18614"
BASE_PATH = "/"
