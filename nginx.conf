events {
  worker_connections 1024;
}

http {
  include      /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  client_max_body_size 10m;

  # ── Gzip ─────────────────────────────────────────────────
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/json application/javascript
             text/xml application/xml text/javascript image/svg+xml
             application/wasm;

  # ── Rate limiting (camada extra no Nginx) ────────────────
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

  server {
    listen 80;
    server_name _;

    # ── Headers de segurança ────────────────────────────────
    add_header X-Content-Type-Options    "nosniff"                       always;
    add_header X-Frame-Options           "SAMEORIGIN"                    always;
    add_header X-XSS-Protection          "1; mode=block"                 always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

    # ── Proxy para a API ────────────────────────────────────
    location /api/ {
      limit_req zone=api burst=50 nodelay;

      proxy_pass         http://api:8080;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        "upgrade";
      proxy_cache_bypass $http_upgrade;
      proxy_read_timeout 120s;
    }

    # Rate limiting extra nas rotas de autenticação
    location ~ ^/api/auth/(login|register|forgot-password) {
      limit_req zone=auth burst=5 nodelay;

      proxy_pass         http://api:8080;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Assets estáticos com cache longo ────────────────────
    location ~* \.(js|css|woff|woff2|ttf|eot|ico|svg|webp|png|jpg|jpeg|gif)$ {
      root    /usr/share/nginx/html;
      expires 1y;
      add_header Cache-Control "public, immutable";
      access_log off;
    }

    # ── Frontend (SPA — todas as rotas para index.html) ─────
    location / {
      root       /usr/share/nginx/html;
      try_files  $uri $uri/ /index.html;
      add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
  }
}
