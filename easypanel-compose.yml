services:

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: lealcert
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data_v2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lealcert"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: willianlealdev/lealcert-api:latest
    pull_policy: always
    restart: unless-stopped
    stop_grace_period: 30s
    user: root
    command: >
      sh -c "mkdir -p /app/uploads/cnh /app/uploads/cartao-cnpj /app/uploads/ficha-cadastral /app/uploads/chat-docs
      && chown -R 1001:1001 /app/uploads
      && su -s /bin/sh appuser -c 'node --enable-source-maps ./dist/index.mjs'"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      PORT: "8080"
      NODE_ENV: production
      ALLOWED_ORIGINS: "https://lealcert.com.br"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

  web:
    image: willianlealdev/lealcert-web:latest
    pull_policy: always
    restart: unless-stopped
    stop_grace_period: 10s
    depends_on:
      - api
    networks:
      - default
      - easypanel

networks:
  default:
  easypanel:
    external: true

volumes:
  postgres_data_v2:
  uploads:
