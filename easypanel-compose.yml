services:

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: lealcert
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Leal2024Xpto
    volumes:
      - postgres_data_v2:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lealcert"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: willianlealdev/lealcert-api:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:Leal2024Xpto@db:5432/lealcert
      SESSION_SECRET: LealCertKey2024
      PORT: "8080"
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

  web:
    image: willianlealdev/lealcert-web:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "8090:80"
    depends_on:
      - api

volumes:
  postgres_data_v2:
  uploads:
