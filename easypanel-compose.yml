services:

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: lealcert
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Leal2024Xpto
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    image: willianlealdev/lealcert-api:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:Leal2024Xpto@db:5432/lealcert
      SESSION_SECRET: LealCertKey2024
      PORT: "8080"
      NODE_ENV: production
    depends_on:
      - db
    volumes:
      - uploads:/app/uploads

  web:
    image: willianlealdev/lealcert-web:latest
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - api

volumes:
  postgres_data:
  uploads:
